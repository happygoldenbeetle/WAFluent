[package]
name = "wafluent-core"
version = "0.1.0"
edition = "2024"
description = "WhatsApp connection for WAFluent: speaks JSON lines over stdin/stdout"
publish = false

[dependencies]
# Defaults minus "simd" (nightly-only portable_simd) and "signal" (we shut down on stdin EOF).
whatsapp-rust = { version = "0.7", default-features = false, features = ["sqlite-storage", "tokio-transport", "tokio-runtime", "tokio-native", "ureq-client"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "io-util", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Must stay on the libsqlite3-sys line whatsapp-rust bundles (0.37 -> rusqlite 0.39).
rusqlite = "0.39"
# Same major as whatsapp-rust's HTTP client; used to download profile pictures.
ureq = "3"
log = "0.4"
env_logger = { version = "0.11", default-features = false, features = ["humantime"] }
phonenumber = "0.3"
# Same line whatsapp-rust uses; hashes favourite stickers (the phone doesn't send it).
sha2 = { version = "0.11", default-features = false }
# Poll secrets (already in whatsapp-rust's tree).
getrandom = "0.4"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true

# whatsapp-rust 0.7.0 with one addition: favourite-sticker app-state mutations reach the
# app (vendor/whatsapp-rust/src/wafluent_hooks.rs). See vendor/README.md.
[patch.crates-io]
whatsapp-rust = { path = "vendor/whatsapp-rust" }
