[package]
edition = "2024"
rust-version = "1.94"
name = "whatsapp-rust"
version = "0.7.0"
authors = ["João Lucas <jlucaso@hotmail.com>"]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Rust client for WhatsApp Web"
readme = "README.md"
license = "MIT"
repository = "https://github.com/jlucaso1/whatsapp-rust"

[package.metadata.docs.rs]
features = ["plugins"]
rustdoc-args = [
    "--cfg",
    "docsrs",
]

[features]
client-lifecycle = []
danger-skip-cert-chain-verify = ["wacore/danger-skip-cert-chain-verify"]
danger-skip-tls-verify = ["whatsapp-rust-tokio-transport?/danger-skip-tls-verify"]
debug-snapshots = ["wacore/debug-snapshots"]
default = [
    "simd",
    "sqlite-storage",
    "tokio-transport",
    "tokio-runtime",
    "ureq-client",
    "tokio-native",
    "signal",
]
legacy-session-interop = ["wacore/legacy-session-interop"]
metrics = ["wacore/metrics"]
plugins = [
    "client-lifecycle",
    "dep:bon",
]
signal = [
    "tokio-runtime",
    "tokio/signal",
]
simd = ["wacore/simd"]
sqlite-storage = ["whatsapp-rust-sqlite-storage"]
tokio-native = [
    "tokio-runtime",
    "tokio/rt-multi-thread",
]
tokio-runtime = ["dep:tokio"]
tokio-transport = ["dep:whatsapp-rust-tokio-transport"]
tracing = [
    "dep:tracing",
    "wacore/tracing",
]
tracing-pii = [
    "wacore/tracing-pii",
    "wacore-binary/tracing-pii",
]
ureq-client = ["dep:whatsapp-rust-ureq-http-client"]
voip = [
    "voip-mlow",
    "voip-libopus",
]
voip-encoded = ["voip-runtime"]
voip-libopus = [
    "voip-encoded",
    "dep:opus",
]
voip-mlow = [
    "voip-runtime",
    "wacore/voip-mlow",
]
voip-runtime = [
    "wacore/voip",
    "tokio-runtime",
    "tokio/net",
    "dep:webrtc-dtls",
    "dep:webrtc-sctp",
    "dep:webrtc-data",
    "dep:webrtc-util",
    "dep:webrtc-util-011",
    "dep:rustls",
]

[lib]
name = "whatsapp_rust"
path = "src/lib.rs"
















